name: ExpBookPlugin
version: 1.0.2
main: com.magicbili.expbook.ExpBookPlugin
api-version: 1.16
folia-supported: true
author: MagicBili
description: A plugin for storing and managing experience points in books with HikariCP connection pool and Caffeine cache
website: https://github.com/addpromax/Expbook

# 库依赖 - Paper 会自动下载这些依赖
libraries:
  - com.zaxxer:HikariCP:5.0.1
  - org.slf4j:slf4j-api:2.0.7
  - org.slf4j:slf4j-jdk14:2.0.7
  - com.github.ben-manes.caffeine:caffeine:3.1.6
  - org.xerial:sqlite-jdbc:3.42.0.0
  - mysql:mysql-connector-java:8.0.28

commands:
  expbook:
    description: Manage experience books
    usage: /<command> [give|list|reload]
    aliases: [eb, xpbook]

permissions:
  expbook.*:
    description: Grants all ExpBook permissions
    default: op
    children:
      expbook.admin: true
      expbook.give: true
      expbook.reload: true
      expbook.common: true
      expbook.advanced: true
      expbook.shared: true
  expbook.admin:
    description: Allows all expbook admin commands
    default: op
    children:
      expbook.give: true
      expbook.reload: true
  expbook.reload:
    description: Allows reloading the plugin configuration
    default: op
  expbook.give:
    description: Allows giving experience books to players
    default: op
  expbook.use:
    description: Allows using any experience book
    default: true
    children:
      expbook.common: true
      expbook.advanced: true
      expbook.shared: true
  expbook.common:
    description: Allows using common experience books
    default: true
  expbook.advanced:
    description: Allows using advanced experience books
    default: true
  expbook.shared:
    description: Allows using shared experience books
    default: true
